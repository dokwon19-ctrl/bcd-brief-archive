<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>출장 브리핑 보관함</title>
<style>
:root{--bg:#ffffff;--ink:#1b2333;--muted:#626b7a;--line:#dfe3e9;--brand:#252850;--accent:#FC4C02;--panel:#f6f7f9;--shadow:rgba(16,24,40,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14181f;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2b3340;--brand:#9db7dc;--panel:#1c222c;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#14181f;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2b3340;--brand:#9db7dc;--panel:#1c222c;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 40px}
h1{color:var(--brand);font-size:20px;margin:0 0 2px}
.sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.lock{max-width:420px;margin:48px auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 20px}
.lock h2{font-size:17px;margin:0 0 6px;color:var(--brand)}
.lock p{margin:0 0 14px;font-size:13px;color:var(--muted)}
.lock input[type=password]{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.lock label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:10px 0 14px}
.lock button{all:unset;cursor:pointer;background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:6px}
.lock button:disabled{opacity:.6;cursor:default}
.lock .err{color:#b42318;font-size:13px;margin-top:10px;min-height:1.2em}
.list{list-style:none;padding:0;margin:0 0 16px;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.list button{all:unset;display:flex;width:100%;justify-content:space-between;gap:12px;align-items:center;padding:10px 6px;cursor:pointer;border-radius:6px}
.list button:hover{background:var(--panel)}
.list button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.list button.on{background:var(--panel)}
.list .d{color:var(--brand);font-weight:700;white-space:nowrap}
.list .t{color:var(--muted);font-size:13px;flex:1;min-width:0}
.list .p{color:var(--muted);font-size:12px;white-space:nowrap}
.viewer{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 8px;font-size:13px;color:var(--muted)}
.bar b{color:var(--ink)}
.pages{display:grid;gap:12px}
.pages img{display:block;width:100%;height:auto;background:#fff;box-shadow:0 2px 10px var(--shadow);border-radius:3px}
.msg{padding:28px 10px;text-align:center;color:var(--muted);font-size:14px}
.dl{display:flex;flex-wrap:wrap;gap:8px;margin:0 2px 10px}
.dl button{all:unset;cursor:pointer;background:var(--brand);color:#fff;font-weight:700;font-size:13px;padding:7px 12px;border-radius:6px}
.dl button:hover{opacity:.9}
.dl button:disabled{opacity:.5;cursor:default}
.dl .note{align-self:center;color:var(--muted);font-size:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.out{all:unset;cursor:pointer;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 9px;white-space:nowrap}
.out:hover{background:var(--panel)}
[hidden]{display:none!important}
@media (max-width:600px){.list .t{display:none}.wrap{padding:14px 12px 32px}}
</style></head><body>
<div class="wrap">
<div class="top"><div><h1>기업 출장 업계 데일리 브리핑 — PDF 보관함</h1>
<p class="sub">BCD Travel Korea · 공개 기사 기반 요약 · 날짜를 누르면 보고서가 펼쳐지고, 위 버튼으로 PDF를 내려받습니다 (최신이 맨 위)</p></div>
<button class="out" id="logout" hidden>잠그기</button></div>

<div class="lock" id="lock">
  <h2>비밀번호를 입력하세요</h2>
  <p>이 보관함의 문서는 암호화되어 있어 비밀번호가 있어야 열립니다.</p>
  <form id="form">
    <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" autofocus>
    <label><input type="checkbox" id="remember"> 이 브라우저에서 기억하기</label>
    <button type="submit" id="go">열기</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app" hidden>
<ul class="list" id="list"></ul>
<div class="viewer">
  <div class="bar"><span id="title">날짜를 고르세요</span><span id="status"></span></div>
  <div class="dl" id="dl"></div>
  <div class="pages" id="pages"><div class="msg">위 목록에서 날짜를 누르세요.</div></div>
</div>
</div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var lockEl=$("lock"), appEl=$("app"), listEl=$("list"), pagesEl=$("pages"), titleEl=$("title"), statusEl=$("status"), dlEl=$("dl"), errEl=$("err"), goBtn=$("go"), outBtn=$("logout");
  var key=null, days=[], current=null, site=null, urls=[];
  var KEY="brief_pw";

  function b64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function ymd(label){ return (label||"").replace(/-/g,"").slice(0,8); }

  function deriveKey(pw, salt, iter){
    var enc=new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]).then(function(km){
      return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:iter, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    });
  }
  function fetchDec(path){
    return fetch(path, {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("fetch "+path); return r.arrayBuffer(); }).then(function(buf){
      var iv=buf.slice(0,12), ct=buf.slice(12);
      return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct);
    });
  }
  function revoke(){ urls.forEach(function(u){ URL.revokeObjectURL(u); }); urls=[]; }

  function unlock(pw, remember){
    goBtn.disabled=true; errEl.textContent="확인 중…";
    return (site?Promise.resolve(site):fetch("site.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){site=j;return j;}))
    .then(function(j){ return deriveKey(pw, b64(j.salt), j.iter||600000); })
    .then(function(k){ key=k; return fetchDec("manifest.enc"); })
    .then(function(buf){
      days=JSON.parse(new TextDecoder().decode(buf)).days||[];
      try{ sessionStorage.setItem(KEY,pw); if(remember) localStorage.setItem(KEY,pw); }catch(e){}
      errEl.textContent=""; goBtn.disabled=false;
      lockEl.hidden=true; appEl.hidden=false; outBtn.hidden=false;
      renderList();
    }).catch(function(e){
      key=null; goBtn.disabled=false;
      errEl.textContent=(e&&e.name==="OperationError")?"비밀번호가 맞지 않습니다.":"열 수 없습니다 — 다시 시도해 주세요.";
      try{ sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); }catch(_){}
    });
  }

  function renderList(){
    listEl.innerHTML="";
    days.forEach(function(d){
      var li=document.createElement("li"), b=document.createElement("button");
      b.setAttribute("data-ymd", d.ymd);
      b.innerHTML='<span class="d"></span><span class="t"></span><span class="p"></span>';
      b.querySelector(".d").textContent=d.date; b.querySelector(".t").textContent=d.title||""; b.querySelector(".p").textContent=d.pages||"";
      b.onclick=function(){ show(d,b); };
      li.appendChild(b); listEl.appendChild(li);
    });
    var want=(location.hash||"").replace("#",""), first=null;
    if(want){ for(var i=0;i<days.length;i++){ if(days[i].ymd===want){ first=days[i]; break; } } }
    if(!first) first=days[0];
    if(first){ var btn=listEl.querySelector('button[data-ymd="'+first.ymd+'"]'); show(first, btn); }
    else pagesEl.innerHTML='<div class="msg">아직 올라온 보고서가 없습니다.</div>';
  }

  function renderDl(d){
    dlEl.innerHTML="";
    (d.files||[]).forEach(function(f){
      var name=f.path.split("/").pop().replace(/\.pdf$/,"");
      var fn="기업출장업계_"+(name.indexOf("opinion")>=0?"견해":name.indexOf("exec")>=0?"경영진브리핑":"데일리브리핑")+"_"+d.ymd+".pdf";
      var b=document.createElement("button"); b.textContent="⬇ "+(f.label||f.path)+" PDF";
      b.onclick=function(){
        b.disabled=true;
        fetchDec("enc/"+f.path+".enc").then(function(buf){
          var blob=new Blob([buf],{type:"application/pdf"}), u=URL.createObjectURL(blob);
          var a=document.createElement("a"); a.href=u; a.download=fn; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
        }).catch(function(){ statusEl.textContent="내려받기 실패 — 다시 시도해 주세요"; }).then(function(){ b.disabled=false; });
      };
      dlEl.appendChild(b);
    });
    if((d.files||[]).length){ var n=document.createElement("span"); n.className="note"; n.textContent="버튼을 누르면 PDF가 저장됩니다"; dlEl.appendChild(n); }
  }

  function show(d, btn){
    if(current===d) return; current=d;
    var all=listEl.querySelectorAll("button"); for(var i=0;i<all.length;i++) all[i].classList.toggle("on", all[i]===btn);
    titleEl.innerHTML="<b></b> 기업 출장 업계 데일리 브리핑"; titleEl.querySelector("b").textContent=d.date;
    statusEl.textContent=(d.imgs||[]).length+"쪽 · 불러오는 중…";
    if(history.replaceState) history.replaceState(null,"","#"+d.ymd);
    renderDl(d); revoke(); pagesEl.innerHTML="";
    var imgs=d.imgs||[], i=0;
    (function next(){
      if(current!==d) return;
      if(i>=imgs.length){ statusEl.textContent=imgs.length+"쪽"; return; }
      var src=imgs[i++];
      fetchDec("enc/"+src+".enc").then(function(buf){
        if(current!==d) return;
        var u=URL.createObjectURL(new Blob([buf],{type:"image/png"})); urls.push(u);
        var im=new Image(); im.src=u; im.alt=d.date+" "+i+"쪽"; pagesEl.appendChild(im);
        next();
      }).catch(function(){ statusEl.textContent="페이지를 불러오지 못했습니다"; });
    })();
    if(!imgs.length) pagesEl.innerHTML='<div class="msg">이 날짜의 이미지가 없습니다.</div>';
  }

  $("form").addEventListener("submit", function(e){ e.preventDefault(); var pw=$("pw").value; if(pw) unlock(pw, $("remember").checked); });
  outBtn.onclick=function(){ try{ sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); }catch(e){} location.hash=""; location.reload(); };
  window.addEventListener("hashchange", function(){ var w=(location.hash||"").replace("#",""); for(var i=0;i<days.length;i++){ if(days[i].ymd===w){ show(days[i], listEl.querySelector('button[data-ymd="'+w+'"]')); break; } } });

  var saved=null; try{ saved=sessionStorage.getItem(KEY)||localStorage.getItem(KEY); }catch(e){}
  if(saved) unlock(saved, false);
})();
</script>
</body></html>
